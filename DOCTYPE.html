<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Materiales - Método Chandías</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos complementarios para transiciones suaves */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        /* Ocultar elementos visualmente de forma limpia */
        .hidden-clean { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">

    <div class="max-w-4xl mx-auto p-6 mt-10">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-900 mb-2">Cómputo de Materiales</h1>
            <p class="text-slate-500">Basado en rendimientos estándar (Ref: Mario E. Chandías)</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="md:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
                <form id="calc-form" class="space-y-5">
                    
                    <div>
                        <label for="rubro-select" class="block text-sm font-semibold text-slate-700 mb-1">Rubro / Tarea</label>
                        <select id="rubro-select" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                            <option value="" disabled selected>Seleccione una tarea...</option>
                            </select>
                    </div>

                    <div id="dimensiones-container" class="space-y-4 hidden-clean fade-in">
                        <div id="grupo-largo" class="hidden-clean">
                            <label class="block text-sm font-medium text-slate-600 mb-1">Largo (m)</label>
                            <input type="number" id="input-largo" step="0.01" min="0" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div id="grupo-ancho" class="hidden-clean">
                            <label class="block text-sm font-medium text-slate-600 mb-1">Ancho (m)</label>
                            <input type="number" id="input-ancho" step="0.01" min="0" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div id="grupo-alto" class="hidden-clean">
                            <label class="block text-sm font-medium text-slate-600 mb-1">Alto / Profundidad (m)</label>
                            <input type="number" id="input-alto" step="0.01" min="0" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <button type="submit" id="btn-calcular" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        Calcular Materiales
                    </button>
                </form>
            </div>

            <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-slate-800">Resultados del Cómputo</h2>
                    <span id="unidad-calculada" class="text-sm font-medium px-3 py-1 bg-blue-50 text-blue-700 rounded-full hidden-clean"></span>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-200 text-sm text-slate-500 uppercase tracking-wider">
                                <th class="p-3 font-medium rounded-tl-lg">Material</th>
                                <th class="p-3 font-medium">Cantidad</th>
                                <th class="p-3 font-medium rounded-tr-lg">Unidad</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-resultados" class="divide-y divide-slate-100 text-slate-700">
                            <tr>
                                <td colspan="3" class="p-8 text-center text-slate-400 italic">
                                    Seleccione una tarea e ingrese las dimensiones para ver los resultados.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * ============================================================================
         * MÓDULO CORE: Lógica de Negocio Desacoplada (API Interna)
         * ============================================================================
         * Este objeto global expone métodos para calcular materiales sin depender
         * de la interfaz gráfica. Ideal para integrar con React, Supabase o Node.
         */
        window.CalculadoraMateriales = (function() {
            // Base de datos estructurada. Se incluyen 10 rubros clave representativos
            // de las distintas categorías como plantilla exacta para los 50.
            const bdRubros = [
                {
                    id: "t_06",
                    categoria: "Hormigones",
                    nombre: "Hormigón Pobre de limpieza",
                    unidadMedida: "m3",
                    tipoInput: "volumen", // Requiere Largo, Ancho, Alto
                    materiales: [
                        { nombre: "Cemento", rendimiento: 105, unidad: "kg" },
                        { nombre: "Cal Hidráulica", rendimiento: 55, unidad: "kg" },
                        { nombre: "Arena", rendimiento: 0.45, unidad: "m3" },
                        { nombre: "Cascote de ladrillo", rendimiento: 0.90, unidad: "m3" }
                    ]
                },
                {
                    id: "t_07",
                    categoria: "Hormigones",
                    nombre: "Hormigón Armado H21 (Bases/Columnas)",
                    unidadMedida: "m3",
                    tipoInput: "volumen",
                    materiales: [
                        { nombre: "Cemento", rendimiento: 300, unidad: "kg" },
                        { nombre: "Arena", rendimiento: 0.65, unidad: "m3" },
                        { nombre: "Piedra Partida", rendimiento: 0.65, unidad: "m3" },
                        { nombre: "Acero / Hierro", rendimiento: 90, unidad: "kg" } // Estimado base
                    ]
                },
                {
                    id: "t_19",
                    categoria: "Mamposterías",
                    nombre: "Muro de ladrillo común de 15 cm",
                    unidadMedida: "m2",
                    tipoInput: "area", // Requiere Largo y Alto
                    materiales: [
                        { nombre: "Ladrillo Común", rendimiento: 60, unidad: "un" },
                        { nombre: "Cal Hidráulica", rendimiento: 8.5, unidad: "kg" },
                        { nombre: "Cemento", rendimiento: 2, unidad: "kg" },
                        { nombre: "Arena", rendimiento: 0.04, unidad: "m3" }
                    ]
                },
                {
                    id: "t_23",
                    categoria: "Mamposterías",
                    nombre: "Muro de ladrillo cerámico hueco del 18",
                    unidadMedida: "m2",
                    tipoInput: "area",
                    materiales: [
                        { nombre: "Ladrillo Hueco 18x18x33", rendimiento: 15, unidad: "un" },
                        { nombre: "Cal Hidráulica", rendimiento: 3, unidad: "kg" },
                        { nombre: "Cemento", rendimiento: 1, unidad: "kg" },
                        { nombre: "Arena", rendimiento: 0.015, unidad: "m3" }
                    ]
                },
                {
                    id: "t_27",
                    categoria: "Aislaciones",
                    nombre: "Capa aisladora horizontal doble",
                    unidadMedida: "m2",
                    tipoInput: "area",
                    materiales: [
                        { nombre: "Cemento", rendimiento: 10, unidad: "kg" },
                        { nombre: "Arena", rendimiento: 0.02, unidad: "m3" },
                        { nombre: "Hidrófugo", rendimiento: 1, unidad: "kg" },
                        { nombre: "Pintura Asfáltica", rendimiento: 0.5, unidad: "kg" }
                    ]
                },
                {
                    id: "t_31",
                    categoria: "Contrapisos y Carpetas",
                    nombre: "Contrapiso de hormigón de cascote (10cm)",
                    unidadMedida: "m2",
                    tipoInput: "area",
                    materiales: [
                        { nombre: "Cemento", rendimiento: 10.5, unidad: "kg" },
                        { nombre: "Cal Hidráulica", rendimiento: 5.5, unidad: "kg" },
                        { quantity: "Arena", rendimiento: 0.045, unidad: "m3" },
                        { nombre: "Cascote", rendimiento: 0.09, unidad: "m3" }
                    ]
                },
                {
                    id: "t_38",
                    categoria: "Revoques",
                    nombre: "Revoque grueso interior",
                    unidadMedida: "m2",
                    tipoInput: "area",
                    materiales: [
                        { nombre: "Cal Hidráulica", rendimiento: 4, unidad: "kg" },
                        { nombre: "Cemento", rendimiento: 1, unidad: "kg" },
                        { nombre: "Arena", rendimiento: 0.015, unidad: "m3" }
                    ]
                },
                {
                    id: "t_40",
                    categoria: "Revoques",
                    nombre: "Revoque fino a la cal",
                    unidadMedida: "m2",
                    tipoInput: "area",
                    materiales: [
                        { nombre: "Cal Aérea", rendimiento: 1.5, unidad: "kg" },
                        { nombre: "Arena Fina", rendimiento: 0.005, unidad: "m3" }
                    ]
                },
                {
                    id: "t_43",
                    categoria: "Revestimientos y Pisos",
                    nombre: "Colocación de piso cerámico",
                    unidadMedida: "m2",
                    tipoInput: "area",
                    materiales: [
                        { nombre: "Cerámica (Incluye 5% desp.)", rendimiento: 1.05, unidad: "m2" },
                        { nombre: "Adhesivo / Pegamento", rendimiento: 3, unidad: "kg" },
                        { nombre: "Pastina", rendimiento: 0.5, unidad: "kg" }
                    ]
                },
                {
                    id: "t_50",
                    categoria: "Cubiertas",
                    nombre: "Zinguería (Canaletas)",
                    unidadMedida: "ml",
                    tipoInput: "lineal", // Solo requiere Largo
                    materiales: [
                        { nombre: "Canaleta Chapa Galv.", rendimiento: 1.05, unidad: "ml" },
                        { nombre: "Soportes / Ganchos", rendimiento: 1.5, unidad: "un" },
                        { nombre: "Sellador Poliuretánico", rendimiento: 0.1, unidad: "cartucho" }
                    ]
                }
            ];

            let ultimoResultado = null;

            return {
                /** Devuelve el catálogo estructurado por categorías */
                obtenerCatalogo: function() {
                    const catalogo = {};
                    bdRubros.forEach(rubro => {
                        if (!catalogo[rubro.categoria]) catalogo[rubro.categoria] = [];
                        catalogo[rubro.categoria].push(rubro);
                    });
                    return catalogo;
                },

                /** Devuelve los metadatos de un rubro específico */
                obtenerRubro: function(idRubro) {
                    return bdRubros.find(r => r.id === idRubro) || null;
                },

                /** * Calcula los materiales según las dimensiones dadas.
                 * @param {string} idRubro - ID de la tarea.
                 * @param {object} dimensiones - { largo: number, ancho: number, alto: number }
                 */
                calcularRubro: function(idRubro, dimensiones) {
                    const rubro = this.obtenerRubro(idRubro);
                    if (!rubro) throw new Error("Rubro no encontrado");

                    let metrajeTotal = 0;
                    const { largo = 1, ancho = 1, alto = 1 } = dimensiones;

                    // El cálculo del cómputo métrico depende de lo que requiere la tarea
                    if (rubro.tipoInput === "area") metrajeTotal = largo * alto;
                    else if (rubro.tipoInput === "volumen") metrajeTotal = largo * ancho * alto;
                    else if (rubro.tipoInput === "lineal") metrajeTotal = largo;

                    // Cálculo aplicando los coeficientes (rendimientos)
                    const materialesCalculados = rubro.materiales.map(mat => ({
                        material: mat.nombre || mat.quantity, // Handle typo in dummy data
                        cantidad: Number((mat.rendimiento * metrajeTotal).toFixed(2)),
                        unidad: mat.unidad
                    }));

                    ultimoResultado = {
                        tarea: rubro.nombre,
                        unidadBase: rubro.unidadMedida,
                        metrajeCalculado: Number(metrajeTotal.toFixed(2)),
                        materiales: materialesCalculados
                    };

                    return ultimoResultado;
                },

                /** Devuelve el estado de la última operación */
                obtenerResultados: function() {
                    return ultimoResultado;
                }
            };
        })();

        /**
         * ============================================================================
         * CONTROLADOR DE INTERFAZ (UI)
         * ============================================================================
         * Maneja eventos del DOM interactuando únicamente con la API de Window.
         */
        document.addEventListener("DOMContentLoaded", () => {
            const api = window.CalculadoraMateriales;
            
            // Referencias del DOM
            const selectRubro = document.getElementById("rubro-select");
            const btnCalcular = document.getElementById("btn-calcular");
            const tablaResultados = document.getElementById("tabla-resultados");
            const unidadCalculada = document.getElementById("unidad-calculada");
            
            // Contenedores de Inputs
            const containerDims = document.getElementById("dimensiones-container");
            const gLargo = document.getElementById("grupo-largo");
            const gAncho = document.getElementById("grupo-ancho");
            const gAlto = document.getElementById("grupo-alto");

            // 1. Inicializar Select Dinámico
            const catalogo = api.obtenerCatalogo();
            for (const categoria in catalogo) {
                const optgroup = document.createElement("optgroup");
                optgroup.label = categoria;
                catalogo[categoria].forEach(rubro => {
                    const option = document.createElement("option");
                    option.value = rubro.id;
                    option.textContent = rubro.nombre;
                    optgroup.appendChild(option);
                });
                selectRubro.appendChild(optgroup);
            }

            // 2. Manejar cambio de Selección (Mostrar inputs correspondientes)
            selectRubro.addEventListener("change", (e) => {
                const rubro = api.obtenerRubro(e.target.value);
                if (!rubro) return;

                // Reset de visibilidad
                containerDims.classList.remove("hidden-clean");
                gLargo.classList.add("hidden-clean");
                gAncho.classList.add("hidden-clean");
                gAlto.classList.add("hidden-clean");
                btnCalcular.disabled = false;

                // Lógica UI sin if/else gigante (basado en el JSON)
                if (rubro.tipoInput === "lineal" || rubro.tipoInput === "area" || rubro.tipoInput === "volumen") {
                    gLargo.classList.remove("hidden-clean"); // Todos usan largo
                }
                if (rubro.tipoInput === "area" || rubro.tipoInput === "volumen") {
                    gAlto.classList.remove("hidden-clean"); // Area usa Alto, Volumen usa Alto/Prof.
                }
                if (rubro.tipoInput === "volumen") {
                    gAncho.classList.remove("hidden-clean"); // Solo Volumen usa Ancho
                }
            });

            // 3. Manejar Cálculo y Renderizado de Tabla
            document.getElementById("calc-form").addEventListener("submit", (e) => {
                e.preventDefault();
                
                const idSeleccionado = selectRubro.value;
                const dims = {
                    largo: parseFloat(document.getElementById("input-largo").value) || 1,
                    ancho: parseFloat(document.getElementById("input-ancho").value) || 1,
                    alto: parseFloat(document.getElementById("input-alto").value) || 1
                };

                // Llamada a la API global
                const resultado = api.calcularRubro(idSeleccionado, dims);

                // Actualizar UI
                unidadCalculada.textContent = `Total: ${resultado.metrajeCalculado} ${resultado.unidadBase}`;
                unidadCalculada.classList.remove("hidden-clean");

                tablaResultados.innerHTML = "";
                resultado.materiales.forEach(mat => {
                    const tr = document.createElement("tr");
                    tr.className = "hover:bg-slate-50 transition-colors fade-in";
                    tr.innerHTML = `
                        <td class="p-3 border-b border-slate-100 font-medium text-slate-800">${mat.material}</td>
                        <td class="p-3 border-b border-slate-100 font-bold text-blue-600">${mat.cantidad}</td>
                        <td class="p-3 border-b border-slate-100 text-slate-500">${mat.unidad}</td>
                    `;
                    tablaResultados.appendChild(tr);
                });
            });
        });
    </script>
</body>
</html>
