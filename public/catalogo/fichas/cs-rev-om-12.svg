        <text class="lbl" x="300" y="265" text-anchor="middle">Perfil Omega 70×13</text>
        <text class="lbl" x="430" y="38" text-anchor="middle">Tarugo N°8 + tornillo</text>
        <text class="lbl" x="120" y="265" text-anchor="middle">Placa de yeso 12,5 mm</text>
      </svg>