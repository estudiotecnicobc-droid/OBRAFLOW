        <g stroke="#333" stroke-width="2">
          <line x1="76" y1="141" x2="76" y2="112"/><line x1="236" y1="141" x2="236" y2="112"/><line x1="396" y1="141" x2="396" y2="112"/>
        </g>
        <!-- placa -->
        <rect x="40" y="153" width="440" height="12.5" fill="var(--placa)" stroke="var(--placa-s)"/>
        <!-- tornillos T2 -->
        <g stroke="#333" stroke-width="1.6">
          <line x1="92" y1="149" x2="92" y2="172"/><line x1="252" y1="149" x2="252" y2="172"/><line x1="412" y1="149" x2="412" y2="172"/>
        </g>
