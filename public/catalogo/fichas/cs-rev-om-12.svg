        <g stroke="#666" stroke-width="1">
          <line x1="92" y1="205" x2="252" y2="205"/><line x1="252" y1="205" x2="412" y2="205"/>
          <line x1="92" y1="199" x2="92" y2="211"/><line x1="252" y1="199" x2="252" y2="211"/><line x1="412" y1="199" x2="412" y2="211"/>
          <line x1="495" y1="140" x2="495" y2="165.5"/><line x1="489" y1="140" x2="501" y2="140"/><line x1="489" y1="165.5" x2="501" y2="165.5"/>
        </g>
        <text class="dim" x="172" y="222" text-anchor="middle">0,40 m</text>
        <text class="dim" x="332" y="222" text-anchor="middle">0,40 m</text>
        <text class="dim" x="505" y="157">≈ 25 mm</text>
        <!-- rótulos -->
        <g stroke="#999" stroke-width=".8" fill="none">
