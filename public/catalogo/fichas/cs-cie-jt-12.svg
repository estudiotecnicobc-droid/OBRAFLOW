<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-label="Corte vertical de cielorraso suspendido"><defs>
<pattern id="p-tierra" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#e2d5bf"/><path d="M2 4l4 4M10 2l3 3M6 12l4 3" stroke="#b9a684" stroke-width="1"/></pattern>
<pattern id="p-horm" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#c4c8cc"/><circle cx="3" cy="3" r="1.1" fill="#8f969c"/><circle cx="9" cy="8" r=".9" fill="#8f969c"/><path d="M7 2l2 1-1 2z" fill="#a3a9ae"/></pattern>
<pattern id="p-mamp" width="24" height="14" patternUnits="userSpaceOnUse"><rect width="24" height="14" fill="#d8a58a"/><path d="M0 0H24M0 7H24M12 0V7M0 7V14M24 7V14" stroke="#f1e6dc" stroke-width="1.4"/></pattern>
<pattern id="p-mort" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#e6e1d6"/><circle cx="2" cy="3" r=".6" fill="#a9a293"/><circle cx="7" cy="7" r=".6" fill="#a9a293"/></pattern>
<pattern id="p-casc" width="18" height="14" patternUnits="userSpaceOnUse"><rect width="18" height="14" fill="#ddd5c6"/><path d="M2 3l5 1-2 4zM11 8l5-1 1 4-4 1z" fill="#c98f74"/></pattern>
<pattern id="p-lana" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#f6e3bd"/><path d="M0 7 Q3.5 0 7 7 T14 7" fill="none" stroke="#d1a85e" stroke-width="1"/></pattern>
<pattern id="p-arena" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe3c4"/><circle cx="2" cy="2" r=".7" fill="#c7b17b"/><circle cx="6" cy="5" r=".7" fill="#c7b17b"/></pattern>
<pattern id="p-madera" width="20" height="8" patternUnits="userSpaceOnUse"><rect width="20" height="8" fill="#e8cfa4"/><path d="M0 4 Q5 2 10 4 T20 4" fill="none" stroke="#c49a5c" stroke-width=".8"/></pattern>
</defs><style>.lbl{font:13px "Segoe UI",Arial,sans-serif;fill:#333}.dim{font:12.5px "Segoe UI",Arial,sans-serif;fill:#555}</style><rect width="100%" height="100%" fill="#fff"/>
        <defs>
          <pattern id="horm" width="10" height="10" patternUnits="userSpaceOnUse">
            <rect width="10" height="10" fill="var(--hormigon)"/><circle cx="3" cy="3" r="1" fill="#9aa0a6"/><circle cx="8" cy="7" r=".8" fill="#9aa0a6"/>
          </pattern>
          <pattern id="mamp" width="20" height="12" patternUnits="userSpaceOnUse">
            <rect width="20" height="12" fill="var(--muro)"/><path d="M0 0H20M0 6H20M10 0V6M0 6V12M20 6V12" stroke="#aaa39a" stroke-width=".8"/>
          </pattern>
        </defs>
        <!-- losa -->
        <rect x="30" y="30" width="470" height="36" fill="url(#horm)" stroke="#8d9297"/>
        <!-- muro -->
        <rect x="30" y="66" width="34" height="200" fill="url(#mamp)" stroke="#9b958c"/>
        <!-- velas rígidas -->
        <g stroke="var(--acero)" stroke-width="3">
          <line x1="200" y1="66" x2="200" y2="196"/>
          <line x1="400" y1="66" x2="400" y2="196"/>
        </g>
        <!-- anclajes -->
        <g fill="#333"><rect x="195" y="66" width="10" height="5"/><rect x="395" y="66" width="10" height="5"/></g>
        <!-- solera perimetral -->
        <path d="M64 196 h12 M64 212 h12 M64 196 v16" stroke="var(--acero)" stroke-width="2.4" fill="none"/>
        <!-- montantes en corte (cada 0,40) -->
        <g fill="var(--acero)">
          <rect x="110" y="200" width="10" height="12"/><rect x="190" y="200" width="10" height="12"/><rect x="270" y="200" width="10" height="12"/>
          <rect x="350" y="200" width="10" height="12"/><rect x="430" y="200" width="10" height="12"/>
        </g>
        <!-- viga maestra -->
        <rect x="70" y="196" width="420" height="4" fill="#9aa5b1"/>
        <!-- placa -->
        <rect x="64" y="212" width="430" height="10" fill="var(--placa)" stroke="var(--placa-s)"/>
        <!-- cotas -->
        <g stroke="#666" stroke-width="1">
          <line x1="115" y1="246" x2="195" y2="246"/><line x1="115" y1="240" x2="115" y2="252"/><line x1="195" y1="240" x2="195" y2="252"/>
          <line x1="200" y1="282" x2="400" y2="282"/><line x1="200" y1="276" x2="200" y2="288"/><line x1="400" y1="276" x2="400" y2="288"/>
        </g>
        <text class="dim" x="155" y="240" text-anchor="middle">0,40 m</text>
        <text class="dim" x="300" y="276" text-anchor="middle">velas rígidas c/1,00 m (máx.)</text>
        <!-- rótulos -->
        <g stroke="#999" stroke-width=".8" fill="none">
          <path d="M400 120 L450 100"/><path d="M300 198 L330 160"/><path d="M470 222 L480 245"/><path d="M70 204 L100 160"/><path d="M200 68 L235 92"/>
        </g>
        <text class="lbl" x="455" y="97">Vela rígida</text>
        <text class="lbl" x="333" y="156">Viga maestra c/1,20 m</text>
        <text class="lbl" x="420" y="258">Placa de yeso 12,5 mm</text>
        <text class="lbl" x="104" y="156">Solera perimetral 35</text>
        <text class="lbl" x="238" y="96">Anclaje a losa</text>
      </svg>