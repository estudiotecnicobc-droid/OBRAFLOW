<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-label="Corte horizontal de tabique de placa de yeso"><defs>
<pattern id="p-tierra" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#e2d5bf"/><path d="M2 4l4 4M10 2l3 3M6 12l4 3" stroke="#b9a684" stroke-width="1"/></pattern>
<pattern id="p-horm" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#c4c8cc"/><circle cx="3" cy="3" r="1.1" fill="#8f969c"/><circle cx="9" cy="8" r=".9" fill="#8f969c"/><path d="M7 2l2 1-1 2z" fill="#a3a9ae"/></pattern>
<pattern id="p-mamp" width="24" height="14" patternUnits="userSpaceOnUse"><rect width="24" height="14" fill="#d8a58a"/><path d="M0 0H24M0 7H24M12 0V7M0 7V14M24 7V14" stroke="#f1e6dc" stroke-width="1.4"/></pattern>
<pattern id="p-mort" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#e6e1d6"/><circle cx="2" cy="3" r=".6" fill="#a9a293"/><circle cx="7" cy="7" r=".6" fill="#a9a293"/></pattern>
<pattern id="p-casc" width="18" height="14" patternUnits="userSpaceOnUse"><rect width="18" height="14" fill="#ddd5c6"/><path d="M2 3l5 1-2 4zM11 8l5-1 1 4-4 1z" fill="#c98f74"/></pattern>
<pattern id="p-lana" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#f6e3bd"/><path d="M0 7 Q3.5 0 7 7 T14 7" fill="none" stroke="#d1a85e" stroke-width="1"/></pattern>
<pattern id="p-arena" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe3c4"/><circle cx="2" cy="2" r=".7" fill="#c7b17b"/><circle cx="6" cy="5" r=".7" fill="#c7b17b"/></pattern>
<pattern id="p-madera" width="20" height="8" patternUnits="userSpaceOnUse"><rect width="20" height="8" fill="#e8cfa4"/><path d="M0 4 Q5 2 10 4 T20 4" fill="none" stroke="#c49a5c" stroke-width=".8"/></pattern>
</defs><style>.lbl{font:13px "Segoe UI",Arial,sans-serif;fill:#333}.dim{font:12.5px "Segoe UI",Arial,sans-serif;fill:#555}</style><rect width="100%" height="100%" fill="#fff"/>
        <defs>
          <pattern id="lana1" width="14" height="14" patternUnits="userSpaceOnUse">
            <path d="M0 7 Q3.5 0 7 7 T14 7" fill="none" stroke="#d1a85e" stroke-width="1"/>
          </pattern>
        </defs>
        <!-- placas -->
        <rect x="40" y="110" width="440" height="12.5" fill="var(--placa)" stroke="var(--placa-s)"/>
        <rect x="40" y="192.5" width="440" height="12.5" fill="var(--placa)" stroke="var(--placa-s)"/>
        <!-- lana -->
        <rect x="40" y="122.5" width="440" height="70" fill="url(#lana1)" opacity=".9"/>
        <!-- montantes (C 69x35) cada 160 px = 0,40 m -->
        <g fill="none" stroke="var(--acero)" stroke-width="2.4">
          <path d="M95 123.5 h-14 v68 h14"/>
          <path d="M255 123.5 h-14 v68 h14"/>
          <path d="M415 123.5 h-14 v68 h14"/>
        </g>
        <!-- tornillos -->
        <g stroke="#333" stroke-width="1.6">
          <line x1="88" y1="104" x2="88" y2="130"/><line x1="248" y1="104" x2="248" y2="130"/><line x1="408" y1="104" x2="408" y2="130"/>
          <line x1="88" y1="185" x2="88" y2="211"/><line x1="248" y1="185" x2="248" y2="211"/><line x1="408" y1="185" x2="408" y2="211"/>
        </g>
        <!-- junta de placas con cinta -->
        <rect x="236" y="106" width="24" height="4" fill="#9db8d6"/>
        <!-- cotas -->
        <g stroke="#666" stroke-width="1">
          <line x1="88" y1="70" x2="248" y2="70"/><line x1="248" y1="70" x2="408" y2="70"/>
          <line x1="88" y1="64" x2="88" y2="76"/><line x1="248" y1="64" x2="248" y2="76"/><line x1="408" y1="64" x2="408" y2="76"/>
          <line x1="495" y1="110" x2="495" y2="205"/><line x1="489" y1="110" x2="501" y2="110"/><line x1="489" y1="205" x2="501" y2="205"/>
        </g>
        <text class="dim" x="168" y="62" text-anchor="middle">0,40 m</text>
        <text class="dim" x="328" y="62" text-anchor="middle">0,40 m</text>
        <text class="dim" x="505" y="161">95 mm</text>
        <!-- rótulos -->
        <g stroke="#999" stroke-width=".8" fill="none">
          <path d="M150 116 L150 40"/><path d="M175 160 L175 255"/><path d="M255 150 L300 255"/><path d="M408 211 L430 255"/><path d="M248 106 L230 40"/>
        </g>
        <text class="lbl" x="150" y="34" text-anchor="middle">Placa de yeso 12,5 mm</text>
        <text class="lbl" x="235" y="34" text-anchor="start">Cinta + masilla en junta</text>
        <text class="lbl" x="175" y="270" text-anchor="middle">Lana de vidrio 50–70 mm</text>
        <text class="lbl" x="300" y="270" text-anchor="middle">Montante 69 mm</text>
        <text class="lbl" x="440" y="270" text-anchor="middle">Tornillo T2</text>
      </svg>