<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="lad" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#f7d9c4"/><path d="M0 0H24M0 6H24M6 0V6M18 6V12" stroke="#c97b4a" stroke-width="1"/></pattern>
  </defs>
  <rect width="640" height="360" fill="#fff"/>
  <text x="20" y="30" font-size="15" font-weight="700" fill="#1f2933">Revestimiento de placa sobre perfil omega — corte en planta</text>
  <text x="20" y="48" font-size="11" fill="#616e7c">Esquema ilustrativo · sin escala</text>
  <!-- muro -->
  <rect x="60" y="90" width="520" height="70" fill="url(#lad)" stroke="#52606d" stroke-width="1.5"/>
  <rect x="60" y="160" width="520" height="8" fill="#d9d2c5" stroke="#52606d"/>
  <!-- omegas -->
  <g fill="none" stroke="#1f2933" stroke-width="3">
    <path d="M110 168 v6 h8 v14 h20 v-14 h8 v-6"/><path d="M270 168 v6 h8 v14 h20 v-14 h8 v-6"/><path d="M430 168 v6 h8 v14 h20 v-14 h8 v-6"/>
  </g>
  <g stroke="#9a6700" stroke-width="2"><line x1="128" y1="150" x2="128" y2="176"/><line x1="288" y1="150" x2="288" y2="176"/><line x1="448" y1="150" x2="448" y2="176"/></g>
  <!-- placa -->
  <rect x="60" y="188" width="520" height="14" fill="#e4e7eb" stroke="#334e68" stroke-width="1.5"/>
  <rect x="356" y="202" width="22" height="4" fill="#3e7cb1"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334e68"/></marker></defs>
  <g stroke="#334e68" stroke-width="1" fill="none">
    <line x1="128" y1="226" x2="288" y2="226" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="128" y1="204" x2="128" y2="232"/><line x1="288" y1="204" x2="288" y2="232"/>
    <line x1="44" y1="168" x2="44" y2="202" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="38" y1="168" x2="60" y2="168"/><line x1="38" y1="202" x2="60" y2="202"/>
  </g>
  <text x="186" y="222" font-size="11" fill="#1f2933">0,40 m</text>
  <text x="4" y="182" font-size="11" fill="#1f2933">≈ 25</text><text x="10" y="196" font-size="10" fill="#616e7c">mm</text>
  <g font-size="12" fill="#1f2933">
    <line x1="200" y1="110" x2="230" y2="72" stroke="#334e68"/><text x="234" y="72">Muro existente</text>
    <line x1="128" y1="152" x2="100" y2="120" stroke="#334e68" opacity="0"/>
    <line x1="296" y1="188" x2="330" y2="250" stroke="#334e68"/><text x="300" y="266">Perfil omega c/0,40 m</text>
    <line x1="456" y1="176" x2="560" y2="232" stroke="#334e68"/><text x="520" y="246" font-size="11">Tarugo + tornillo</text>
    <line x1="520" y1="202" x2="540" y2="250" stroke="#334e68"/><text x="456" y="266">Placa de yeso 12,5 mm</text>
    <text x="456" y="280" font-size="11" fill="#616e7c">(verde RH en zonas húmedas)</text>
    <line x1="367" y1="206" x2="380" y2="300" stroke="#334e68"/><text x="320" y="316" font-size="11">Cinta + masilla en juntas</text>
    <text x="60" y="340" font-size="11" fill="#616e7c">Revoque seco: la placa va pegada al muro con adhesivo, sin perfiles.</text>
  </g>
</svg>
